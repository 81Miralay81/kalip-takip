<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3b2a8f">
<link rel="manifest" href="/manifest.json">
<title>Kalıp Takip</title>
<style>
:root{--bg:#10142b;--kart:#171c3a;--kart2:#1f2548;--kenar:#2c3366;--yazi:#eef1ff;--soluk:#9aa3d6;--mor:#7c3aed;--mavi:#3b82f6;--yesil:#10b981;--kirmizi:#ef4444;--sari:#fde047;--turuncu:#f59e0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--yazi);font:15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh}
header{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#2a1d78,#4c2fb8);padding:10px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;cursor:pointer}
header small{color:#d3d9ff;font-size:12px}
header button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer}
main{padding:14px 18px;max-width:none;margin:0 auto}
h2{margin:6px 0 12px;font-size:20px}
h3{margin:14px 0 6px;font-size:15px;color:#c7d2fe}
.kart{background:var(--kart);border:1px solid var(--kenar);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--soluk);margin:8px 0 3px}
input,select,textarea{width:100%;background:var(--kart2);border:1px solid var(--kenar);color:var(--yazi);border-radius:10px;padding:10px 12px;font-size:15px;outline:none;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--mavi)}
input[readonly],input:disabled,select:disabled{opacity:.6}
input[type=checkbox]{width:auto;margin-right:6px}
button.b{border:0;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;color:#fff;background:linear-gradient(90deg,var(--mavi),var(--mor));cursor:pointer}
button.b.yesil{background:linear-gradient(90deg,var(--yesil),#059669)}
button.b.kirmizi{background:linear-gradient(90deg,var(--kirmizi),#be185d)}
button.b.turuncu{background:linear-gradient(90deg,var(--turuncu),#ec4899)}
button.b.gri{background:#3a4170}
button.b:disabled{opacity:.5;cursor:default}
.arac{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.arac>input{flex:1 1 220px;min-width:160px}
.arac>select{flex:0 1 200px}
.alan{display:flex;gap:10px;flex-wrap:wrap}
.alan>div{flex:1 1 180px;min-width:140px}
.portal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pk{border-radius:16px;padding:20px;color:#fff;cursor:pointer;min-height:120px;border:0;text-align:left;font-family:inherit}
.pk b{font-size:18px;display:block;margin-bottom:6px}
.pk span{font-size:13px;opacity:.9}
.tw{overflow:auto;max-height:calc(100vh - 215px);min-height:200px;border:1px solid var(--kenar);border-radius:12px}
.tbl th{overflow:hidden;text-overflow:ellipsis}
.tbl.sabit{table-layout:fixed;width:100%}
.tbl.sabit th.dolgu,.tbl.sabit td.dolgu{padding:0;border-left:0}
.tbl.sabit td{max-width:none}
.tbl th .rs{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:col-resize;touch-action:none;user-select:none}
.tbl th .rs:hover,.tbl th .rs.tut{background:#7c8cff}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th{position:sticky;top:0;background:#2a2f66;text-align:left;padding:8px 10px;white-space:nowrap;z-index:1}
.tbl td{padding:7px 10px;border-top:1px solid var(--kenar);white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
.tbl tr.sec td{background:#2d3478}
.secsat{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#1e2550;border:1px solid #4b57b8;border-radius:10px;padding:8px 12px;font-size:13px}
.grafikler{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px;margin-top:14px}
@media(max-width:900px){.grafikler{grid-template-columns:1fr}}
.gk{padding:14px}
.lej{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:#cbd5e1;margin-top:4px}
.lej i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;flex:0 0 auto}
.lej.dik{flex-direction:column;flex-wrap:nowrap;gap:7px;margin:0;flex:1 1 180px;min-width:180px}
.lej.dik>div{display:flex;align-items:center;gap:6px}
.lej.dik .ln{flex:1;min-width:0}
.lej.dik b{color:#f1f5f9}
.lej.dik small{color:#94a3b8;min-width:48px;text-align:right}
.pasta{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tbl th{box-shadow:inset -1px 0 0 #6b76d1,inset 0 -1px 0 #6b76d1}
.tbl td{box-shadow:inset -1px 0 0 rgba(120,130,220,.22)}
.tbl th.dolgu,.tbl td.dolgu{box-shadow:none}
@media(pointer:coarse){.tbl tbody tr{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:#252b5c}
.tbl td input,.tbl td select{padding:6px 8px;font-size:13px}
.et{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--kart2);color:#cbd2ff;display:inline-block;margin:2px 4px 2px 0}
.hata{background:#4c1d1d;color:#fecaca;border-radius:10px;padding:10px;margin:8px 0;font-size:14px}
.tamam{background:#064e3b;color:#a7f3d0;border-radius:10px;padding:10px;margin:8px 0;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-start;justify-content:center;z-index:30;overflow:auto;padding:20px 10px}
.modal>.ic{background:var(--bg);border:1px solid var(--kenar);border-radius:16px;padding:16px;width:100%;max-width:760px}
.modal>.ic.genis{max-width:1100px}
.sekmeler{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.sekmeler button{border:0;background:var(--kart2);color:var(--soluk);padding:8px 14px;border-radius:9px;cursor:pointer}
.sekmeler button.on{background:linear-gradient(90deg,var(--mavi),var(--mor));color:#fff}
.iki{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
@media(max-width:1000px){.iki{grid-template-columns:minmax(0,1fr)!important}.iki>*{min-width:0}}
.oneri{position:absolute;z-index:40;background:#1e2350;border:1px solid var(--mavi);border-radius:10px;max-height:300px;overflow:auto;min-width:420px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.oneri div{padding:8px 12px;cursor:pointer;font-size:14px;white-space:nowrap}
.oneri div.on,.oneri div:hover{background:#3b4aa8}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:60;padding:12px 18px;border-radius:12px;max-width:90vw;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.t{background:#065f46}.toast.h{background:#991b1b}.toast.b{background:#1e3a8a}
#giris{max-width:420px;margin:12vh auto 0;padding:0 16px}
#giris h2{text-align:center}
.sinir{color:var(--soluk);font-size:13px;margin:6px 0}
video{width:100%;border-radius:12px;margin-top:8px;background:#000}
.combo{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24'><path fill='%239aa3d6' d='M7 10l5 5 5-5z'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:30px}
.izg{margin:10px 0 2px;font-weight:700;color:#c7d2fe}
.ac{border:1px solid #2a3350;border-radius:8px;margin:8px 0;background:#141a2c}
.ac>summary{cursor:pointer;padding:9px 12px;font-weight:700;color:#c7d2fe;list-style:none;display:flex;justify-content:space-between;align-items:center;user-select:none}
.ac>summary::-webkit-details-marker{display:none}
.ac>summary::before{content:'▸';margin-right:8px;transition:transform .15s}
.ac[open]>summary::before{transform:rotate(90deg)}
.ac>summary .ad{flex:1}
.ac>summary .sy{font-size:12px;font-weight:600;color:#93c5fd;background:#1e293b;border-radius:10px;padding:1px 9px}
.ac>.ic{padding:2px 12px 10px}
.izl label{display:flex;align-items:center;color:var(--yazi);font-size:14px;margin:3px 0}
@media(max-width:700px){
html,body{font-size:15px;overflow-x:hidden}
header{padding:8px 10px;flex-wrap:wrap;gap:6px}
header h1{font-size:16px;flex:1 1 auto}
header small{order:3;flex:1 0 100%;font-size:11px}
header button{padding:8px 10px;min-height:38px}
main{padding:10px 8px}
h2{font-size:18px}
.kart{padding:10px;border-radius:12px}
input,select,textarea{font-size:16px;min-height:42px}
input[type=checkbox]{min-height:0;width:20px;height:20px}
button.b{min-height:42px;padding:9px 12px}
.arac{gap:6px}
.arac>input{flex:1 1 100%;min-width:0}
.arac>select{flex:1 1 calc(50% - 6px)!important;min-width:0}
.arac>button{flex:1 1 auto}
.alan>div{flex:1 1 100%;min-width:0}
.portal{grid-template-columns:1fr 1fr;gap:10px}
.pk{padding:14px;min-height:96px}
.pk b{font-size:15px}
.tbl td{max-width:180px;padding:8px}
.tw{max-height:60vh}
.modal{padding:0}
.modal>.ic,.modal>.ic.genis{max-width:100%!important;min-height:100%;border-radius:0;border-left:0;border-right:0;padding:12px 10px}
.oneri{min-width:0;max-width:calc(100vw - 16px)}
.oneri div{white-space:normal}
.toast{bottom:12px;left:8px;right:8px;transform:none;max-width:none;text-align:center}
.sekmeler button{padding:9px 12px;flex:1 1 auto}
#giris{margin-top:6vh}
}
@media(max-width:380px){.portal{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="giris" style="display:none">
  <h2>Kalıp Takip</h2>
  <div class="kart">
    <label>Kullanıcı adı</label><input id="gAd" autocomplete="username">
    <label>Parola</label><input id="gParola" type="password" autocomplete="current-password">
    <label>Cihaz adı <span style="opacity:.7">(bu cihazı tanımlayın, örn. "Ali - telefon"; yeni cihazda zorunlu)</span></label><input id="gCihazAd" autocomplete="off" maxlength="60">
    <div id="gHata"></div>
    <p><button class="b" id="gBtn" style="width:100%">Giriş yap</button></p>
  </div>
</div>
<div id="uygulama" style="display:none">
  <header><h1 id="baslik">Kalıp Takip</h1><small id="kisi"></small><button id="portalBtn">Portal</button><button id="cikis">Çıkış</button></header>
  <main id="icerik"></main>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const SURUM='03.11.2026-Z13';
let T=localStorage.getItem('kt_token'), ME=null;

function el(tag,props,...kids){
  const e=document.createElement(tag);
  if(props)for(const k in props){const v=props[k];
    if(k==='class')e.className=v;else if(k==='style')e.style.cssText=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='value')e.value=v==null?'':v;
    else if(k==='checked'||k==='disabled'||k==='readOnly')e[k]=!!v;
    else if(v!==null&&v!==undefined&&v!==false)e.setAttribute(k,v)}
  kids.flat(9).forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(String(c)))});
  return e;
}
function sel(secenekler,deger,props,bos){
  const s=el('select',props);
  if(bos!==undefined)s.append(el('option',{value:''},bos));
  secenekler.forEach(o=>{const v=typeof o==='object'?o.v:o,t=typeof o==='object'?o.t:o;s.append(el('option',{value:v},t))});
  if(deger!=null&&deger!==''&&![...s.options].some(o=>o.value===String(deger)))s.append(el('option',{value:deger},deger));
  s.value=deger==null?'':deger;
  return s;
}
// Tüm seçenekleri tıklayınca / odaklanınca açan, yazdıkça süzen açılır liste (datalist yerine).
function combo(input,liste){
  input.classList.add('combo');input.setAttribute('autocomplete','off');
  let kutu=null,filtre=false;
  const kapat=()=>{if(kutu){kutu.remove();kutu=null}};
  function ac(){
    kapat();
    const t=filtre?input.value.toLocaleLowerCase('tr'):'';
    const l=liste.filter(x=>!t||String(x).toLocaleLowerCase('tr').includes(t));
    if(!l.length)return;
    const r=input.getBoundingClientRect();
    kutu=el('div',{class:'oneri',style:'position:fixed;left:'+r.left+'px;top:'+(r.bottom+2)+'px;min-width:'+r.width+'px;max-width:90vw'},
      l.map(x=>el('div',{onmousedown:e=>{e.preventDefault();input.value=x;input.dispatchEvent(new Event('input'));input.dispatchEvent(new Event('change'));kapat()}},x)));
    document.body.append(kutu);
  }
  input.addEventListener('focus',()=>{filtre=false;ac()});
  input.addEventListener('click',()=>{if(!kutu){filtre=false;ac()}});
  input.addEventListener('input',e=>{if(e.isTrusted){filtre=true;ac()}});
  input.addEventListener('blur',()=>setTimeout(kapat,150));
  input.addEventListener('keydown',e=>{if(e.key==='Escape')kapat()});
  document.addEventListener('scroll',kapat,true);
  return input;
}
function veriListe(id,liste){return el('datalist',{id},liste.map(x=>el('option',{value:x})))}

function bildir(m,tur){
  const t=el('div',{class:'toast '+(tur||'b')},m);document.body.append(t);
  setTimeout(()=>t.remove(),tur==='h'?7000:3500);
}
async function api(yol,govde){
  const o={headers:{'X-Token':T||''}};
  if(govde!==undefined){o.method='POST';o.body=JSON.stringify(govde);o.headers['Content-Type']='application/json'}
  let r;
  try{r=await fetch(yol,o)}catch(e){throw new Error('Sunucuya ulaşılamadı. Bağlantınızı kontrol edin.')}
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&T&&yol!=='/api/giris'){oturumKapat();throw new Error(j.hata||'Oturum kapandı.')}
  if(!r.ok)throw new Error(j.hata||'Hata ('+r.status+')');
  return j;
}
async function indir(yol,ad){
  try{
    const r=await fetch(yol,{headers:{'X-Token':T||''}});
    if(!r.ok){let j={};try{j=await r.json()}catch(e){}throw new Error(j.hata||'İndirilemedi')}
    const b=await r.blob(),u=URL.createObjectURL(b),a=el('a',{href:u,download:ad});document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),2000);
  }catch(e){bildir(e.message,'h')}
}
function izin(k){return ME&&ME.izinler.indexOf(k)>=0}
function qs(o){return Object.keys(o).filter(k=>o[k]!==''&&o[k]!=null).map(k=>k+'='+encodeURIComponent(o[k])).join('&')}

// ---- biçimleme
function fmtTarih(v){
  if(v==null||v==='')return '';
  const m=/^(\d{4})-(\d{2})-(\d{2})(?: (\d{2}:\d{2}))?/.exec(v);
  return m?(m[3]+'.'+m[2]+'.'+m[1]+(m[4]?' '+m[4]:'')):String(v);
}
function fmtSayi(v){if(v==null||v==='')return '';const n=Number(v);return isNaN(n)?String(v):n.toLocaleString('tr-TR',{maximumFractionDigits:2})}
function fmt(tip,v){if(v==null)return '';if(tip==='Tarih')return fmtTarih(v);if(tip==='Ondalik')return fmtSayi(v);return String(v)}
function bugun(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function iso10(v){return v?String(v).slice(0,10):''}
// "1425+1220", "1100/60", "(5+3)*2" gibi basit işlemleri hesaplar; geçersizse null. Boş metin -> null.
function hesapla(m){
  if(m==null)return null;
  let t=String(m).trim();
  if(!t)return null;
  t=t.replace(/,/g,'.');
  if(!/^[0-9.+\-*\/()\s]+$/.test(t))return null;
  try{const r=Function('"use strict";return ('+t+')')();return (typeof r==='number'&&isFinite(r))?r:null}catch(e){return null}
}
function yaz2(d){return (Math.round(d*100)/100).toString().replace('.',',')}
function sayiMetin(v){return v==null?'':String(v).replace('.',',')}

// Sütun genişlikleri tarayıcıda saklanır (sayfa + sütun listesi başına); başlığın sağ kenarından sürükleyerek değiştirilir.
function tablo(kolonlar,satirlar,opt){
  opt=opt||{};
  const anah='kt_kg:'+((location.hash||'').replace('#/','').split('?')[0])+':'+kolonlar.map(k=>k.alan).join(',');
  let gen={};try{gen=JSON.parse(localStorage.getItem(anah)||'{}')||{}}catch(e){gen={}}
  const vars=k=>gen[k.alan]||(k.tip==='Tarih'?112:k.tip==='Tam'?96:k.alan==='KalipAdi'?280:150);
  const tb=el('tbody');
  satirlar.forEach((s,i)=>{
    const tr=el('tr',{onclick:()=>{if(opt.sec)opt.sec(s,tr,i)}},kolonlar.map(k=>el('td',{title:fmt(k.tip,s[k.alan])},fmt(k.tip,s[k.alan]))).concat([el('td',{class:'dolgu'})]));
    tb.append(tr);
  });
  if(!satirlar.length)tb.append(el('tr',null,el('td',{colspan:kolonlar.length+1,style:'color:#9aa3d6'},'Kayıt yok.')));
  const tbl=el('table',{class:'tbl sabit'});
  const topla=()=>{tbl.style.minWidth=kolonlar.reduce((a,k)=>a+vars(k),0)+'px'};
  const basliklar=kolonlar.map(k=>{
    const th=el('th',{style:'width:'+vars(k)+'px',title:k.baslik},k.baslik);
    const rs=el('span',{class:'rs',title:'Sürükleyerek genişliği değiştirin'});
    rs.addEventListener('click',e=>e.stopPropagation());
    rs.addEventListener('pointerdown',e=>{
      e.preventDefault();e.stopPropagation();
      try{rs.setPointerCapture(e.pointerId)}catch(x){}
      const x0=e.clientX,w0=th.offsetWidth;rs.classList.add('tut');
      const tasi=ev=>{const nw=Math.max(50,Math.round(w0+ev.clientX-x0));gen[k.alan]=nw;th.style.width=nw+'px';topla()};
      const bitti=()=>{rs.classList.remove('tut');rs.removeEventListener('pointermove',tasi);rs.removeEventListener('pointerup',bitti);rs.removeEventListener('pointercancel',bitti);try{localStorage.setItem(anah,JSON.stringify(gen))}catch(x){}};
      rs.addEventListener('pointermove',tasi);rs.addEventListener('pointerup',bitti);rs.addEventListener('pointercancel',bitti);
    });
    rs.addEventListener('dblclick',e=>{e.stopPropagation();delete gen[k.alan];th.style.width=vars(k)+'px';topla();try{localStorage.setItem(anah,JSON.stringify(gen))}catch(x){}});
    th.append(rs);return th;
  });
  topla();
  tbl.append(el('thead',null,el('tr',null,basliklar,el('th',{class:'dolgu'}))),tb);
  return el('div',{class:'tw',style:opt.stil||''},tbl);
}
function secIsaretle(tr){const p=tr.parentNode;p.querySelectorAll('tr.sec').forEach(x=>x.classList.remove('sec'));tr.classList.add('sec')}

function aramayaOdak(){setTimeout(()=>{const q=document.querySelector('#icerik .arac input:not([type=file])');if(q){q.focus();q.select()}},50)}
function modal(baslik,icerik,genis){
  const ov=el('div',{class:'modal'});
  const kapat=()=>ov.remove();
  const ic=el('div',{class:'ic'+(genis?' genis':'')},
    el('div',{style:'display:flex;align-items:center;margin-bottom:6px'},el('h2',{style:'flex:1;margin:0'},baslik),el('button',{class:'b gri',onclick:kapat},'✕')),icerik);
  ov.append(ic);
  ov.addEventListener('mousedown',e=>{if(e.target===ov)ov._md=true;else ov._md=false});
  ov.addEventListener('click',e=>{if(e.target===ov&&ov._md)kapat()});
  document.body.append(ov);
  return {kapat,ov};
}
async function onay(m){return confirm(m)}

// ---- kamera: barkod + yapay zeka ile yazı okuma (dövme / nokta vuruş kalıp kodları)
const kamVar=window.isSecureContext&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
const KOD={liste:null,adlar:{}};
async function kodlariYukle(){
  if(KOD.liste)return KOD.liste;
  try{const j=await api('/api/kodlar');KOD.liste=j.kodlar||[];KOD.adlar=j.adlar||{}}catch(e){KOD.liste=[];KOD.adlar={}}
  return KOD.liste;
}
const BENZER_HARF={'O':'0','0':'O','Q':'0','D':'0','I':'1','L':'1','1':'I','S':'5','5':'S','B':'8','8':'B','Z':'2','2':'Z','G':'6','6':'G'};
function temizKod(x){return (x||'').toUpperCase().replace(/[^A-Z0-9-]/g,'')}
function mesafe(a,b){
  const n=a.length,m=b.length;let onceki=[];for(let j=0;j<=m;j++)onceki[j]=j;
  for(let i=1;i<=n;i++){
    const simdi=[i];
    for(let j=1;j<=m;j++){
      const ayni=a[i-1]===b[j-1];
      const sub=ayni?0:(BENZER_HARF[a[i-1]]===b[j-1]?0.4:1);
      simdi[j]=Math.min(onceki[j]+1,simdi[j-1]+1,onceki[j-1]+sub);
    }
    onceki=simdi;
  }
  return onceki[m];
}
function benzerKodlar(metin,liste,adet){
  const t=temizKod(metin);
  if(t.length<4)return [];
  const sonuc=[];
  for(const k of liste){
    const kk=temizKod(k);
    if(Math.abs(kk.length-t.length)>2)continue;
    const d=mesafe(t,kk);
    if(d<=1.5)sonuc.push({k,d});
  }
  sonuc.sort((x,y)=>x.d-y.d);
  return sonuc.slice(0,adet);
}
function aiKare(video){
  // Ekranda görünen şerit (object-fit:cover) içindeki sarı çerçeve, kameranın ham görüntüsündeki karşılığına çevrilir.
  const vw=video.videoWidth,vh=video.videoHeight,W=video.clientWidth||vw,H=video.clientHeight||vh;
  const ol=Math.max(W/vw,H/vh),ox=(vw*ol-W)/2,oy=(vh*ol-H)/2;
  const zk=video._zoom||1,bx=W/2+(W*0.08-W/2)/zk,by=H/2+(H*0.20-H/2)/zk,bw=W*0.84/zk,bh=H*0.60/zk;
  let sx=Math.round((bx+ox)/ol),sy=Math.round((by+oy)/ol),sw=Math.round(bw/ol),sh=Math.round(bh/ol);
  sx=Math.max(0,Math.min(sx,vw-1));sy=Math.max(0,Math.min(sy,vh-1));sw=Math.min(sw,vw-sx);sh=Math.min(sh,vh-sy);
  const o=Math.min(1,560/sw),w=Math.round(sw*o),h=Math.round(sh*o);
  const c=document.createElement('canvas');c.width=w;c.height=h;
  c.getContext('2d').drawImage(video,sx,sy,sw,sh,0,0,w,h);
  return c.toDataURL('image/jpeg',0.75);
}
// Okunan metin parçalarından, sistemdeki kalıp kodlarına puan verir (okuma tekrar ettikçe puan birikir).
// Tam / yakın eşleşme: yüksek puan. Yalnız rakam okunduysa (ör. 2363): içinde bu rakamlar geçen tüm kodlar; bir hane yanlış okunduysa da yakın olanlar.
function adayPuanla(parcalar,liste,puan){
  parcalar.forEach(t=>{
    t=temizKod(t);
    if(t.length<3||t==='YOK')return;
    benzerKodlar(t,liste,5).forEach(b=>{if(b.d<=1.5)puan.set(b.k,(puan.get(b.k)||0)+(b.d===0?3:2))});
    const rk=t.replace(/[^0-9]/g,'');
    if(rk.length>=3){
      let bulundu=false;
      liste.forEach(kod=>{if(temizKod(kod).replace(/[^0-9]/g,'').includes(rk)){puan.set(kod,(puan.get(kod)||0)+1);bulundu=true}});
      if(!bulundu&&rk.length>=4)liste.forEach(kod=>{
        const blok=(temizKod(kod).match(/\d+/)||[''])[0];
        if(blok.length===rk.length&&mesafe(blok,rk)<=1)puan.set(kod,(puan.get(kod)||0)+0.5);
      });
    }
  });
}
// Joker destekli eşleşme: "1123" = içinde 1123 yan yana geçen tüm kodlar; "1123*-1" = 1123 geçen ve -1 ile biten; "DK1123*" = sonu serbest.
function jokerRegex(q){
  const parcalar=q.toUpperCase().replace(/[^A-Z0-9*-]/g,'').split('*');
  const kac=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const sonSerbest=parcalar.length>1&&parcalar[parcalar.length-1]==='';
  const govde=parcalar.filter((x,i)=>x!==''||(i>0&&i<parcalar.length-1)).map(kac).join('.*');
  if(!govde)return null;
  return new RegExp(govde+(parcalar.length>1&&!sonSerbest?'$':''));
}
// Yazarak arama: eşleşenleri sıralı döndürür (başı eşleşen önce, sonra kısa kodlar).
function kodAra(q,liste,sinir){
  const t=(q||'').trim();if(t.replace(/[^A-Za-z0-9]/g,'').length<2)return [];
  const re=jokerRegex(t);if(!re)return [];
  const jokerli=t.indexOf('*')>=0,duz=temizKod(t);
  const sonuc=[];
  for(const k of liste){
    const kk=temizKod(k);if(!re.test(kk))continue;
    sonuc.push({k,p:(!jokerli&&kk===duz)?3:(!jokerli&&kk.indexOf(duz)===0)?2.5:(jokerli&&re.test(kk)&&kk.search(re)===0)?2.5:2});
  }
  sonuc.sort((x,y)=>y.p-x.p||x.k.length-y.k.length||(x.k<y.k?-1:1));
  return sonuc.slice(0,sinir||60);
}
// Yapay zeka okuması: okunan metin kodların içinde yan yana geçiyorsa aday olur.
// Harf/rakam karışıklığı (S/5, O/0, I/1, B/8, Z/2, G/6) için tek karakter değiştirilmiş biçimler de denenir (501833 -> S01833).
function adayPuanlaSiki(t,liste,puan){
  t=temizKod(t);if(t.length<3||t==='YOK')return;
  const varyant=[];
  if(/[A-Z]/.test(t)||/^[0-9]*[5-8021][0-9-]*$/.test(t)&&/^[5801]/.test(t)){
    for(let i=0;i<Math.min(t.length,4);i++){const c=BENZER_HARF[t[i]];if(c&&!(/\d/.test(t[i])&&i>=2))varyant.push(t.slice(0,i)+c+t.slice(i+1))}
  }
  const dene=(metin,agirlik)=>{
    liste.forEach(kod=>{
      const kk=temizKod(kod),yer=kk.indexOf(metin);
      if(yer<0)return;
      const baslangic=yer===0||kk[yer-1]==='-'?0.5:0;
      puan.set(kod,(puan.get(kod)||0)+agirlik+baslangic+(kk===metin?1:0));
    });
  };
  dene(t,2);
  varyant.forEach(v=>{if(v.length>=3)dene(v,1.2)});
  if(![...puan.keys()].length&&t.length>=5){benzerKodlar(t,liste,5).forEach(b=>{if(b.d<=1)puan.set(b.k,(puan.get(b.k)||0)+(b.d===0?3:1.5))})}
}
// Yapay zeka okuması boşluklu / tiresiz olabilir ("1123 K 1", "1123K1"): parçalar arasına joker (*) konup aranır, birleştirilmez.
function aiAdayPuanla(ham,liste,puan){
  const norm=String(ham||'').toUpperCase().replace(/[^A-Z0-9\s*-]/g,' ').trim();
  if(!norm||norm==='YOK')return;
  let parca=norm.split(/[\s*]+/).filter(x=>x.replace(/-/g,''));
  const toplam=new Map();
  if(parca.length>1){
    const pat=parca.join('*');
    let r=kodAra(pat,liste,60);
    if(!r.length)r=kodAra(pat+'*',liste,60);
    r.forEach(x=>toplam.set(x.k,3));
  }else{
    adayPuanlaSiki(parca[0]||'',liste,toplam);
    if(!toplam.size){
      const gec=(parca[0]||'').replace(/([A-Z])(?=[0-9])|([0-9])(?=[A-Z])/g,'$1$2*');
      if(gec.indexOf('*')>=0){let r=kodAra(gec,liste,60);if(!r.length)r=kodAra(gec+'*',liste,60);r.forEach(x=>toplam.set(x.k,2))}
    }
  }
  toplam.forEach((v,k)=>puan.set(k,(puan.get(k)||0)+v));
}

// DK ile başlayan kodlarda son -N parçası prosesi gösterir.
const PROSES={1:'Dövme',2:'Makas',3:'Baskı',4:'Sıcak Kalibre',5:'Soğuk Kalibre',6:'Bükme',7:'Sıcak Kalibre delme',8:'Soğuk Delme',9:'Sıcak Delme',10:'Ezme',11:'Rekvals'};
function prosesAdi(kod){

  if(!kod){
    const a=new Uint8Array(16);crypto.getRandomValues(a);
    kod=Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join('')+'-'+Date.now().toString(36);
  }
  try{localStorage.setItem('kt_cihaz',kod)}catch(e){}
  cerezYaz(kod);await idbYaz(kod);
  return {kod,depo};
}
function tarayiciAdi(){
  const u=navigator.userAgent;let m;
  if(m=/Edg(?:e|A|iOS)?\/([\d.]+)/.exec(u))return 'Edge '+m[1].split('.')[0];
  if(m=/OPR\/([\d.]+)/.exec(u))return 'Opera '+m[1].split('.')[0];
  if(m=/SamsungBrowser\/([\d.]+)/.exec(u))return 'Samsung Internet '+m[1].split('.')[0];
  if(m=/(?:Chrome|CriOS)\/([\d.]+)/.exec(u))return 'Chrome '+m[1].split('.')[0];
  if(m=/(?:Firefox|FxiOS)\/([\d.]+)/.exec(u))return 'Firefox '+m[1].split('.')[0];
  if(m=/Version\/([\d.]+).*Safari/.exec(u))return 'Safari '+m[1].split('.')[0];
  return 'Bilinmiyor';
}
function isletimAdi(){
  const u=navigator.userAgent;let m;
  if(m=/Android ([\d.]+)/.exec(u))return 'Android '+m[1];
  if(m=/(?:iPhone|iPad|CPU) OS ([\d_]+)/.exec(u))return 'iOS '+m[1].replace(/_/g,'.');
  if(/Windows NT 10/.test(u))return 'Windows 10/11';
  if(m=/Windows NT ([\d.]+)/.exec(u))return 'Windows NT '+m[1];
  if(/Mac OS X/.test(u))return 'macOS';
  if(/CrOS/.test(u))return 'ChromeOS';
  if(/Linux/.test(u))return 'Linux';
  return 'Bilinmiyor';
}
function cihazTuru(){
  const u=navigator.userAgent;
  if(/iPad|Tablet/.test(u)||(/Android/.test(u)&&!/Mobile/.test(u)))return 'Tablet';
  if(/Mobi|iPhone|Android/.test(u))return 'Telefon';
  return 'Bilgisayar';
}

    cekirdek:navigator.hardwareConcurrency||0,bellek:navigator.deviceMemory||0,dokunmatik:navigator.maxTouchPoints||0,depo:depo||{},ua:navigator.userAgent.slice(0,150)}).slice(0,590)}catch(e){return ''}
}

function istGrafik(satirlar0,turler,tipler,secili,temizle){
  const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const TUR_RENK={'TASHİH':'#f59e0b','YENİ':'#22c55e','İLAVE':'#38bdf8','(boş)':'#94a3b8','TAMİR':'#f472b6','HURDA':'#ef4444'};
  const YEDEK=['#a78bfa','#fb923c','#2dd4bf','#e879f9','#facc15','#60a5fa'];
  let yi=0;const turRenk={};turler.forEach(u=>{turRenk[u]=TUR_RENK[u]||YEDEK[yi++%YEDEK.length]});
  const TIP_RENK=['#6366f1','#14b8a6','#f59e0b','#ec4899','#22c55e','#38bdf8','#a78bfa','#fb923c'];
  const kisa=t=>{t=String(t).replace(/\s*KALIBI?\s*$/i,'').replace(/\s*KALIP\s*$/i,'');return t.length>14?t.slice(0,13)+'…':t};
  const secRow=secili?satirlar0.find(r=>r['Kalıp türü']===secili):null;
  const satirlar=secRow?turler.map(u=>{const n=secRow[u]||0;return {'Kalıp türü':u,Toplam:n,[u]:n}}):satirlar0;
  const veri=satirlar.filter(r=>r.Toplam>0);
  const wrap=el('div',{class:'grafikler'});
  if(secRow)wrap.append(el('div',{class:'secsat'},el('span',null,'Seçili kalıp türü: ',el('b',null,secili),' — tasarım modeline göre dağılım'),el('button',{class:'b gri',onclick:temizle},'✕ Seçimi kaldır')));
  if(!veri.length){wrap.append(el('div',{class:'sinir'},'Grafik için veri yok.'));return wrap}
  // ---- mum (sütun) grafiği: kalıp türüne göre yığılmış, tasarım modeli renkli
  const W=620,H=330,sol=46,ust=26,alt=70,sag=12;
  const pw=W-sol-sag,ph=H-ust-alt;
  const enBuyuk=Math.max(...veri.map(r=>r.Toplam));
  const adim=(()=>{const ham=enBuyuk/4,us=Math.pow(10,Math.floor(Math.log10(ham||1)));for(const m of [1,2,2.5,5,10])if(m*us>=ham)return m*us;return us*10})();
  const tavan=Math.ceil(enBuyuk/adim)*adim||1;
  let g='';
  for(let v=0;v<=tavan+0.0001;v+=adim){const y=ust+ph-(v/tavan)*ph;g+='<line x1="'+sol+'" x2="'+(W-sag)+'" y1="'+y+'" y2="'+y+'" stroke="rgba(148,163,184,.18)"/><text x="'+(sol-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="#94a3b8">'+v.toLocaleString('tr')+'</text>'}
  const bw=pw/veri.length,kw=Math.min(54,bw*0.62);
  veri.forEach((r,i)=>{
    const x=sol+bw*i+(bw-kw)/2;let y=ust+ph;
    turler.forEach(u=>{const n=r[u]||0;if(!n)return;const h=n/tavan*ph;y-=h;
      g+='<rect x="'+x+'" y="'+y+'" width="'+kw+'" height="'+Math.max(h,1)+'" rx="2" fill="'+turRenk[u]+'"><title>'+esc((secRow?secili:r['Kalıp türü'])+' — '+u+': '+n.toLocaleString('tr'))+'</title></rect>'});
    g+='<text x="'+(x+kw/2)+'" y="'+(y-6)+'" text-anchor="middle" font-size="11" font-weight="700" fill="#e2e8f0">'+r.Toplam.toLocaleString('tr')+'</text>';
    g+='<text x="'+(x+kw/2)+'" y="'+(ust+ph+16)+'" text-anchor="middle" font-size="11" fill="#cbd5e1"><title>'+esc(r['Kalıp türü'])+'</title>'+esc(kisa(r['Kalıp türü']))+'</text>';
  });
  const bar=el('div',{class:'kart gk'});
  bar.append(el('h3',{style:'margin:0 0 6px'},secRow?'Tasarım modeline göre kayıt sayısı':'Kalıp türüne göre kayıt sayısı'));
  const sv1=el('div');sv1.innerHTML='<svg viewBox="0 0 '+W+' '+(H-alt+24)+'" width="100%" role="img" aria-label="Sütun grafik">'+g+'</svg>';bar.append(sv1);
  const lej=el('div',{class:'lej'});turler.forEach(u=>lej.append(el('span',null,el('i',{style:'background:'+turRenk[u]}),u)));bar.append(lej);
  // ---- pasta (halka): kalıp türünün payı
  const toplam=veri.reduce((a,r)=>a+r.Toplam,0),R=78,C=2*Math.PI*R;
  let pg='',ofs=0;
  veri.forEach((r,i)=>{const len=r.Toplam/toplam*C;
    pg+='<circle r="'+R+'" cx="110" cy="110" fill="none" stroke="'+(secRow?turRenk[r['Kalıp türü']]:TIP_RENK[i%TIP_RENK.length])+'" stroke-width="34" stroke-dasharray="'+Math.max(len-1.5,0.5)+' '+(C-Math.max(len-1.5,0.5))+'" stroke-dashoffset="'+(-ofs)+'" transform="rotate(-90 110 110)"><title>'+esc(r['Kalıp türü']+': '+r.Toplam.toLocaleString('tr')+' (%'+(r.Toplam/toplam*100).toFixed(1).replace('.',',')+')')+'</title></circle>';
    ofs+=len});
  pg+='<text x="110" y="106" text-anchor="middle" font-size="12" fill="#94a3b8">Toplam</text><text x="110" y="130" text-anchor="middle" font-size="24" font-weight="700" fill="#f1f5f9">'+toplam.toLocaleString('tr')+'</text>';
  const pasta=el('div',{class:'kart gk'});
  pasta.append(el('h3',{style:'margin:0 0 6px'},secRow?'Tasarım modeli payı':'Kalıp türü payı'));
  const ic=el('div',{class:'pasta'});
  const sv2=el('div',{style:'flex:0 0 200px;max-width:100%;margin:0 auto'});sv2.innerHTML='<svg viewBox="0 0 220 220" width="200" height="200" role="img" aria-label="Pasta grafik">'+pg+'</svg>';
  const lj=el('div',{class:'lej dik'});
  veri.forEach((r,i)=>lj.append(el('div',null,el('i',{style:'background:'+(secRow?turRenk[r['Kalıp türü']]:TIP_RENK[i%TIP_RENK.length])}),el('span',{class:'ln',title:r['Kalıp türü']},kisa(r['Kalıp türü'])),el('b',null,'%'+(r.Toplam/toplam*100).toFixed(1).replace('.',',')),el('small',null,r.Toplam.toLocaleString('tr')))));
  ic.append(sv2,lj);pasta.append(ic);
  wrap.append(bar,pasta);return wrap;
}
async function ktIstatistik(bolum0){
  const bas=el('input',{type:'date'}),bit=el('input',{type:'date'}),sonuc=el('div');
  let secTip=null,sonVeri=null;const grafikKutu=el('div');
  const hafta=el('input',{placeholder:'örn. 42/2026',list:'dlHafta',autocomplete:'off',style:'max-width:180px'});

  hafta.onkeydown=e=>{if(e.key==='Enter')getir()};

  api('/api/kt/haftalar').then(j=>{(j.haftalar||[]).forEach(h=>dlHafta.append(el('option',{value:h.hafta,label:h.adet+' kayıt'})))}).catch(()=>{});
  const bol=sel(bolumSecenekleri(),bolum0||'',{},'Tüm bölümler');bol.onchange=()=>getir();
  function grafikCiz(){

      const j=await api('/api/kt/istatistik?'+qs({bas:bas.value,bit:bit.value,bolum:bol.value,hafta:hafta.value}));
      const turler=[...new Set(j.satirlar.map(x=>x.Tur||'(boş)'))].sort();
      const tipler=[...new Set(j.satirlar.map(x=>x.KalipTuru||'(boş)'))].sort();
      const sayi={};j.satirlar.forEach(x=>{sayi[(x.KalipTuru||'(boş)')+'|'+(x.Tur||'(boş)')]=x.Adet});
      const satirlar=tipler.map(t=>{const o={'Kalıp türü':t};let top=0;turler.forEach(u=>{const n=sayi[t+'|'+u]||0;o[u]=n;top+=n});o.Toplam=top;return o});
      const kol=[{alan:'Kalıp türü',baslik:'Kalıp türü'}].concat(turler.map(u=>({alan:u,baslik:u})),[{alan:'Toplam',baslik:'Toplam'}]);
      const gen={'Kalıp türü':'TOPLAM'};let g=0;turler.forEach(u=>{const n=satirlar.reduce((a,r)=>a+r[u],0);gen[u]=n;g+=n});gen.Toplam=g;satirlar.push(gen);
      sonVeri={satirlar:satirlar.slice(0,-1),turler,tipler};
      if(secTip&&!sonVeri.satirlar.some(r=>r['Kalıp türü']===secTip))secTip=null;
      const tb=tablo(kol,satirlar,{sec:(r,tr)=>{
        const ad=r['Kalıp türü'];
        if(ad==='TOPLAM'||ad===secTip){secTip=null;tr.parentNode.querySelectorAll('tr.sec').forEach(x=>x.classList.remove('sec'))}
        else{secTip=ad;secIsaretle(tr)}
        grafikCiz();
      }});
      sonuc.innerHTML='';sonuc.append(el('div',{class:'sinir'},'İpucu: tablodan bir kalıp türüne tıklayın, grafikler o türe göre değişir. Aynı satıra tekrar tıklayınca seçim kalkar.'),tb,grafikKutu);
      if(secTip){const i=sonVeri.satirlar.findIndex(r=>r['Kalıp türü']===secTip);const trs=tb.querySelectorAll('tbody tr');if(trs[i])trs[i].classList.add('sec')}
      grafikCiz();
    }catch(e){sonuc.innerHTML='';sonuc.append(el('div',{class:'hata'},e.message))}
  }
  modal('İstatistik (bitiş tarihine göre)',el('div',null,
    el('div',{class:'arac'},el('span',null,'Başlangıç'),bas,el('span',null,'Bitiş'),bit,el('span',null,'Bölüm'),bol,el('button',{class:'b',onclick:getir},'Getir')),
    el('div',{class:'arac'},el('span',null,'Hafta / yıl'),hafta,dlHafta,el('button',{class:'b gri',onclick:()=>{hafta.value='';getir()}},'Temizle'),el('span',{class:'sinir',style:'margin:0'},'Yazdıkça hafta seçenekleri açılır (örn. 42/202 → 42/2025, 42/2026). Bitiş tarihinin haftasına göre.')),sonuc),true);
  getir();

function oneriBagla(input,sec){
  let kutu=null,items=[],idx=-1,zaman;
  function kapat(){if(kutu){kutu.remove();kutu=null}items=[];idx=-1}
  function ciz(){
    if(kutu)kutu.remove();
    if(!items.length){kutu=null;return}
    const r=input.getBoundingClientRect();
    kutu=el('div',{class:'oneri',style:'left:'+(r.left+scrollX)+'px;top:'+(r.bottom+scrollY+2)+'px'});
    items.forEach((x,i)=>kutu.append(el('div',{class:i===idx?'on':'',onmousedown:e=>{e.preventDefault();kapat();sec(x.ParcaKodu)}},
      x.ParcaKodu+'  •  '+(x.ParcaAdi||'')+'  •  '+(x.Lokasyon||'-')+'  •  '+(x.SahipBolum||'-'))));
    document.body.append(kutu);
  }
  async function ac(){
    const t=input.value.trim();
    if(t.length<2){kapat();return}
    try{const j=await api('/api/talep/kalipara?q='+encodeURIComponent(t));items=j.satirlar;idx=items.length?0:-1;ciz()}catch(e){kapat()}
  }
  input.addEventListener('input',()=>{clearTimeout(zaman);zaman=setTimeout(ac,250)});
  input.addEventListener('blur',()=>setTimeout(kapat,150));
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'&&kutu){e.preventDefault();idx=Math.min(items.length-1,idx+1);ciz()}
    else if(e.key==='ArrowUp'&&kutu){e.preventDefault();idx=Math.max(0,idx-1);ciz()}
    else if(e.key==='Escape')kapat();
    else if(e.key==='Enter'){
      e.preventDefault();
      const yaz=input.value.trim();
      if(kutu&&items.length){
        const tam=items.find(x=>String(x.ParcaKodu).toLocaleLowerCase('tr')===yaz.toLocaleLowerCase('tr'));
        const x=tam||items[Math.max(0,idx)];kapat();sec(x.ParcaKodu);
      }else{kapat();sec(yaz)}
    }
  });
}
