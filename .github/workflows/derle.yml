name: Derle
on:
  push:
  workflow_dispatch:
jobs:
  derle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Derle (Release)
        run: dotnet build KalipTakip.sln -c Release
      - name: SQL Server sinamasi (LocalDB)
        continue-on-error: true
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          & "KalipTakip.Sunucu/bin/Release/net48/KalipTakipSunucu.exe" --sinama "Server=(localdb)\MSSQLLocalDB;Integrated Security=true;Initial Catalog=master"
          if ($LASTEXITCODE -ne 0) { throw "Sinama basarisiz" }
      - name: Paketler
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force paket/Sunucu | Out-Null
          New-Item -ItemType Directory -Force paket/Masaustu | Out-Null
          Copy-Item KalipTakip.Sunucu/bin/Release/net48/* paket/Sunucu -Recurse -Force
          Copy-Item KalipTakip.App/bin/Release/net48/* paket/Masaustu -Recurse -Force
      - uses: actions/upload-artifact@v4
        with:
          name: KalipTakip
          path: paket
