name: SqlProbe
on:
  push:
    paths: ['.github/workflows/sqlprobe.yml']
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Sql servisleri
        shell: pwsh
        run: |
          Get-Service *sql* | Format-Table Name,Status,StartType -AutoSize
          Write-Host "--- localdb"
          try { sqllocaldb info } catch { Write-Host "sqllocaldb yok" }
          Write-Host "--- sqlcmd"
          where.exe sqlcmd 2>&1
          Write-Host "--- kayit"
          Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty PSChildName
